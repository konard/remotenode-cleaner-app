name: cleaner_app
description: A production-ready Cleaner App for cache, junk files, RAM, and duplicates cleaning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  device_info_plus: ^9.1.1
  vibration: ^1.8.4
  audioplayers: ^5.2.1
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.1.0
  animations: ^2.0.8
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#4CAF50"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#4CAF50"
    icon_background_color: "#4CAF50"
    image: assets/splash/splash_logo.png

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/splash/
    - assets/sounds/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
